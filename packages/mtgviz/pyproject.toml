[project]
name = "mtgviz"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dylan Miracle", email = "dylan@strangeworks.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "memray",
    "numpy>=2.4.1",
    "pillow",
    "pytesseract",
    "rich",
    "typer",
]

[project.scripts]
mtgviz = "mtgviz:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"
