[project]
name = "mtgdb"
version = "0.1.0"
description = "MTG database models and MTGJSON sync"
requires-python = ">=3.14"
dependencies = [
    "sqlmodel>=0.0.27",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "rich>=13.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]
