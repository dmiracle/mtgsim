<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Deck Viewer</title>
    <link rel="stylesheet" href="/resources/keyrune-master/css/keyrune.css">
    <link rel="stylesheet" href="/resources/mana-master/css/mana.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.7/build/d3.layout.cloud.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            height: 100vh;
            background: #1a1a2e;
            color: #eee;
            overflow: hidden;
        }
        .sidebar {
            width: 300px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            height: 100vh;
            overflow: hidden;
        }
        #decksTab, #pricesTab, #setsTab, #draftTab {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }
        .sidebar h1 {
            padding: 20px;
            font-size: 1.3rem;
            background: #0f3460;
            color: #e94560;
            cursor: pointer;
        }
        .tab-bar {
            display: flex;
            background: #1a1a2e;
            border-bottom: 1px solid #0f3460;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #888;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        .tab-btn:hover {
            color: #ccc;
            background: #0f3460;
        }
        .tab-btn.active {
            color: #e94560;
            background: #0f3460;
            border-bottom: 2px solid #e94560;
        }
        .search-box {
            padding: 10px;
            background: #1a1a2e;
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #16213e;
            color: #eee;
            font-size: 14px;
        }
        .search-box input::placeholder {
            color: #666;
        }
        .deck-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 0;
        }
        .deck-item {
            padding: 10px 15px;
            cursor: pointer;
            border-radius: 5px;
            margin-bottom: 5px;
            background: #1a1a2e;
            transition: background 0.2s;
        }
        .deck-item:hover {
            background: #0f3460;
        }
        .deck-item.active {
            background: #e94560;
            color: white;
        }
        .deck-item .deck-name {
            font-weight: 500;
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 5px;
        }
        .deck-colors {
            display: flex;
            gap: 2px;
        }
        .deck-colors .ms {
            font-size: 0.7rem;
        }
        .deck-item .deck-code {
            font-size: 0.8rem;
            color: #888;
            display: flex;
            justify-content: space-between;
        }
        .deck-item.active .deck-code {
            color: #ffc;
        }
        .deck-price {
            color: #4a4;
            font-weight: 500;
        }
        .deck-item.active .deck-price {
            color: #8f8;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            height: 100vh;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
        }
        .deck-header {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #0f3460;
        }
        .deck-header h2 {
            color: #e94560;
            margin-bottom: 10px;
        }
        .deck-meta {
            display: flex;
            gap: 20px;
            color: #888;
            font-size: 0.9rem;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h3 {
            color: #e94560;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #0f3460;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .card {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #0f3460;
        }
        .card-image {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 10px;
        }
        .card-image-placeholder {
            width: 100%;
            aspect-ratio: 488/680;
            background: #0f3460;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 0.8rem;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }
        .card-name {
            font-weight: 600;
            color: #fff;
            flex: 1;
        }
        .card-mana {
            font-family: monospace;
            color: #ffd700;
            margin-left: 10px;
        }
        .card-type {
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }
        .card-text {
            font-size: 0.85rem;
            line-height: 1.4;
            color: #ccc;
            margin-bottom: 8px;
        }
        .card-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #0f3460;
        }
        .card-pt {
            font-weight: 600;
            color: #4ade80;
        }
        .card-rarity {
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 3px;
            background: #0f3460;
        }
        .rarity-common { color: #aaa; }
        .rarity-uncommon { color: #c0c0c0; }
        .rarity-rare { color: #ffd700; }
        .rarity-mythic { color: #ff6b35; }
        .card-count {
            background: #e94560;
            color: white;
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 0.85rem;
        }
        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #0f3460;
        }
        .color-identity {
            display: flex;
            gap: 4px;
        }
        .card-price {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            font-size: 0.75rem;
        }
        .price-paper {
            color: #4ade80;
            background: rgba(74, 222, 128, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .price-mtgo {
            color: #60a5fa;
            background: rgba(96, 165, 250, 0.1);
            padding: 2px 6px;
            border-radius: 3px;
        }
        .price-none {
            color: #666;
            font-style: italic;
        }
        .decks-containing-card {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        .decks-containing-card .deck-item {
            background: #16213e;
            border: 1px solid #0f3460;
        }
        .price-card-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }
        .price-card-left {
            flex-shrink: 0;
        }
        .price-card-right {
            flex: 1;
            min-width: 0;
        }
        .price-card-right .section {
            margin: 0;
        }
        .price-card-right .decks-containing-card {
            max-height: none;
        }
        .card-uuid {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #0f3460;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }
        .card-uuid:hover {
            opacity: 1;
        }
        .uuid-text {
            font-size: 0.65rem;
            font-family: monospace;
            color: #666;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .uuid-copy {
            font-size: 0.7rem;
            flex-shrink: 0;
        }
        .card-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid #0f3460;
        }
        .add-to-deck-btn {
            background: transparent;
            border: 1px solid #4cc9f0;
            color: #4cc9f0;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .add-to-deck-btn:hover {
            background: #4cc9f0;
            color: #0a0a23;
        }
        .card-uuid-inline {
            font-size: 0.6rem;
            font-family: monospace;
            color: #555;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .card-uuid-inline:hover {
            color: #aaa;
        }
        .deck-picker-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .deck-picker-item:hover {
            background: #1a1a2e;
        }
        .deck-picker-item .deck-picker-name {
            color: #e0e0e0;
        }
        .deck-picker-item .deck-picker-meta {
            font-size: 0.75rem;
            color: #666;
        }
        .mana-symbol {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: bold;
        }
        .mana-W { background: #f9faf4; color: #000; }
        .mana-U { background: #0e68ab; color: #fff; }
        .mana-B { background: #150b00; color: #fff; border: 1px solid #444; }
        .mana-R { background: #d3202a; color: #fff; }
        .mana-G { background: #00733e; color: #fff; }
        .mana-C { background: #ccc; color: #000; }
        .welcome {
            text-align: center;
            padding: 100px 20px;
        }
        .welcome h2 {
            color: #e94560;
            margin-bottom: 20px;
        }
        .welcome p {
            color: #888;
        }
        .stats {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .stat {
            background: #0f3460;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
        }
        .deck-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #16213e;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }
        .stat-card {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 8px;
        }
        .stat-card-2col {
            grid-column: span 2;
        }
        .stat-card h4 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 0.85rem;
            border-bottom: 1px solid #0f3460;
        }
        .stat-row:last-child {
            border-bottom: none;
        }
        .stat-label {
            color: #888;
        }
        .stat-value {
            color: #fff;
            font-weight: 500;
        }
        .mana-curve {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            height: 100px;
            padding-top: 10px;
        }
        .mana-bar {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .mana-bar-fill {
            width: 100%;
            background: linear-gradient(to top, #e94560, #ff6b6b);
            border-radius: 3px 3px 0 0;
            min-height: 2px;
        }
        .mana-bar-label {
            font-size: 0.75rem;
            color: #888;
        }
        .mana-bar-count {
            font-size: 0.7rem;
            color: #fff;
        }
        .color-pie {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .color-stat {
            display: flex;
            align-items: center;
            gap: 5px;
            background: #0f3460;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.85rem;
        }
        .big-number {
            font-size: 2rem;
            font-weight: bold;
            color: #e94560;
        }
        .big-number-label {
            font-size: 0.8rem;
            color: #888;
        }
        .help-btn {
            position: fixed;
            top: 15px;
            right: 15px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #0f3460;
            border: 1px solid #e94560;
            color: #e94560;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .help-btn:hover {
            background: #e94560;
            color: white;
        }
        .glossary-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        .glossary-modal.active {
            display: flex;
        }
        .glossary-content {
            background: #16213e;
            border-radius: 10px;
            max-width: 700px;
            max-height: 85vh;
            width: 90%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .glossary-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0f3460;
        }
        .glossary-header h3 {
            color: #e94560;
            margin: 0;
        }
        .glossary-search {
            padding: 15px 20px;
            border-bottom: 1px solid #0f3460;
        }
        .glossary-search input {
            width: 100%;
            padding: 10px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #1a1a2e;
            color: #eee;
            font-size: 14px;
        }
        .glossary-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .glossary-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #0f3460;
        }
        .glossary-item:last-child {
            border-bottom: none;
        }
        .glossary-term {
            color: #e94560;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .glossary-def {
            color: #ccc;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .glossary-category {
            color: #ffd700;
            font-size: 0.75rem;
            background: #0f3460;
            padding: 2px 8px;
            border-radius: 3px;
            margin-left: 10px;
        }
        .filter-box {
            padding: 10px;
            border-bottom: 1px solid #0f3460;
        }
        .filter-box label {
            font-size: 0.8rem;
            color: #888;
            display: block;
            margin-bottom: 5px;
        }
        .filter-box select {
            width: 100%;
            padding: 8px;
            border: 1px solid #0f3460;
            border-radius: 5px;
            background: #16213e;
            color: #eee;
            font-size: 13px;
        }
        .color-filter {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .color-checkbox {
            cursor: pointer;
            opacity: 0.4;
            transition: opacity 0.2s;
        }
        .color-checkbox:hover {
            opacity: 0.7;
        }
        .color-checkbox:has(input:checked) {
            opacity: 1;
        }
        .color-checkbox input {
            display: none;
        }
        .color-checkbox .ms {
            font-size: 1.2rem;
        }
        .deck-count {
            padding: 8px 10px;
            background: #1a1a2e;
            color: #888;
            font-size: 0.8rem;
            border-bottom: 1px solid #0f3460;
        }
        .legality-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .legality-badge {
            font-size: 0.75rem;
            padding: 3px 8px;
            border-radius: 3px;
            background: #0f3460;
        }
        .legality-badge.legal {
            background: #166534;
            color: #4ade80;
        }
        .legality-badge.not-legal {
            background: #7f1d1d;
            color: #f87171;
        }
        .home-screen {
            padding: 20px;
        }
        .home-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .home-header h2 {
            color: #e94560;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .home-header p {
            color: #888;
        }
        .home-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .home-stat {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #0f3460;
        }
        .home-stat-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }
        .home-stat-label {
            color: #888;
            font-size: 0.85rem;
            margin-top: 5px;
        }
        .home-section {
            background: #16213e;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
        }
        .home-section h3 {
            color: #e94560;
            margin-bottom: 15px;
        }
        .home-bar-chart {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .home-bar-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .home-bar-label {
            width: 140px;
            font-size: 0.85rem;
            color: #ccc;
            text-align: right;
            flex-shrink: 0;
        }
        .home-bar-container {
            flex: 1;
            height: 24px;
            background: #0f3460;
            border-radius: 4px;
            overflow: hidden;
        }
        .home-bar-fill {
            height: 100%;
            background: linear-gradient(to right, #e94560, #ff6b6b);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 8px;
            font-size: 0.75rem;
            color: white;
            min-width: 30px;
        }
        .home-no-data {
            color: #666;
            font-style: italic;
            padding: 10px 0;
        }
        .set-code {
            color: #ffd700;
            cursor: pointer;
            text-decoration: underline;
            text-decoration-style: dotted;
        }
        .set-code:hover {
            color: #e94560;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: #16213e;
            border-radius: 10px;
            max-width: 800px;
            max-height: 80vh;
            width: 90%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #0f3460;
        }
        .modal-header h3 {
            color: #e94560;
            margin: 0;
        }
        .modal-close {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .modal-close:hover {
            color: #e94560;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
        }
        .modal-body pre {
            background: #1a1a2e;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.4;
        }
        .json-key { color: #e94560; }
        .json-string { color: #4ade80; }
        .json-number { color: #ffd700; }
        .json-boolean { color: #ff6b35; }
        .json-null { color: #888; }
        .json-bracket { color: #888; }
        .json-toggle {
            cursor: pointer;
            user-select: none;
            display: inline-block;
            width: 16px;
            color: #888;
        }
        .json-toggle:hover { color: #e94560; }
        .json-collapsible { margin-left: 20px; }
        .json-collapsed { display: none; }
        .json-ellipsis {
            color: #888;
            display: none;
        }
        .json-collapsed + .json-ellipsis { display: inline; }
        .raw-btn {
            background: #0f3460;
            border: none;
            color: #888;
            padding: 3px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 5px;
        }
        .raw-btn:hover {
            background: #e94560;
            color: white;
        }
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 15px;
            border-top: 1px solid #0f3460;
        }
        .pagination button {
            padding: 8px 16px;
            background: #0f3460;
            border: none;
            color: #eee;
            border-radius: 5px;
            cursor: pointer;
        }
        .pagination button:hover:not(:disabled) {
            background: #e94560;
        }
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .pagination span {
            color: #888;
        }

        /* Card Detail View */
        .card-detail-layout {
            display: flex;
            gap: 32px;
            align-items: flex-start;
        }
        .card-detail-left {
            flex-shrink: 0;
            width: 320px;
        }
        .card-detail-left img {
            width: 100%;
            border-radius: 12px;
        }
        .card-detail-right {
            flex: 1;
            min-width: 0;
        }
        .card-detail-header {
            margin-bottom: 16px;
        }
        .card-detail-header h2 {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .card-detail-header .card-mana-cost {
            font-size: 1.1rem;
        }
        .card-detail-type-line {
            color: #ccc;
            font-size: 1rem;
            margin-top: 4px;
        }
        .card-detail-stats-row {
            display: flex;
            gap: 16px;
            margin: 8px 0;
        }
        .card-detail-stat {
            background: #16213e;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 1.1rem;
        }
        .card-detail-section {
            margin-top: 20px;
        }
        .card-detail-section h3 {
            color: #e94560;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            border-bottom: 1px solid #0f3460;
            padding-bottom: 4px;
        }
        .card-detail-oracle {
            background: #16213e;
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .card-detail-flavor {
            background: #16213e;
            padding: 12px 16px;
            border-radius: 8px;
            font-style: italic;
            color: #aaa;
            border-left: 3px solid #0f3460;
            margin-top: 8px;
        }
        .card-detail-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 8px;
        }
        .card-detail-meta-item {
            display: flex;
            flex-direction: column;
            background: #16213e;
            padding: 8px 12px;
            border-radius: 6px;
        }
        .card-detail-meta-item .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }
        .card-detail-meta-item .value {
            font-size: 0.9rem;
            margin-top: 2px;
        }
        .legalities-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 4px;
        }
        .legality-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 10px;
            border-radius: 4px;
            background: #16213e;
            font-size: 0.85rem;
        }
        .legality-item .format-name {
            text-transform: capitalize;
        }
        .legality-badge {
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }
        .legality-badge.legal { background: #1b5e20; color: #a5d6a7; }
        .legality-badge.restricted { background: #e65100; color: #ffcc80; }
        .legality-badge.banned { background: #b71c1c; color: #ef9a9a; }
        .legality-badge.not-legal { background: #333; color: #666; }
        .prices-table {
            width: 100%;
            border-collapse: collapse;
        }
        .prices-table th {
            text-align: left;
            padding: 6px 10px;
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #888;
            border-bottom: 1px solid #0f3460;
        }
        .prices-table td {
            padding: 6px 10px;
            border-bottom: 1px solid #1a1a2e;
            font-size: 0.9rem;
        }
        .prices-table td:last-child {
            text-align: right;
            font-weight: 600;
            color: #4caf50;
        }
        .printings-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 8px;
        }
        .printing-thumb {
            flex-shrink: 0;
            width: 100px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.15s;
        }
        .printing-thumb:hover {
            transform: scale(1.05);
        }
        .printing-thumb img {
            width: 100%;
            border-radius: 6px;
        }
        .printing-thumb .printing-label {
            font-size: 0.7rem;
            color: #aaa;
            margin-top: 4px;
        }
        .printing-thumb .owned-indicator {
            color: #4caf50;
            font-size: 0.7rem;
        }
        .card-detail-back {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            color: #888;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 12px;
            transition: color 0.15s;
        }
        .card-detail-back:hover { color: #e94560; }
        .keywords-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .keyword-tag {
            background: #0f3460;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            color: #ccc;
        }

        /* Draft tab styles */
        .draft-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 12px;
        }
        .draft-controls select, .draft-controls input {
            width: 100%;
            padding: 8px;
            background: #16213e;
            border: 1px solid #0f3460;
            color: #e0e0e0;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .draft-controls button {
            padding: 10px;
            background: #e94560;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .draft-controls button:hover { background: #d63851; }
        .draft-controls button:disabled { background: #555; cursor: not-allowed; }
        .booster-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
            gap: 12px;
            padding: 16px;
        }
        .booster-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .booster-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.5);
        }
        .booster-card img {
            width: 100%;
            display: block;
            border-radius: 10px;
        }
        .booster-card .card-slot {
            position: absolute;
            top: 6px;
            left: 6px;
            background: rgba(0,0,0,0.7);
            color: #ccc;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        .booster-card.foil-card {
            box-shadow: 0 0 12px rgba(200, 150, 255, 0.4);
        }
        .booster-card.foil-card::after {
            content: 'FOIL';
            position: absolute;
            top: 6px;
            right: 6px;
            background: linear-gradient(135deg, #c084fc, #60a5fa, #34d399);
            color: white;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .booster-card-fallback {
            background: #16213e;
            padding: 16px;
            border-radius: 10px;
            border: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 240px;
            justify-content: center;
        }
        .booster-card-fallback .card-name {
            font-weight: 600;
            color: #e0e0e0;
            font-size: 0.9rem;
        }
        .booster-card-fallback .card-type {
            font-size: 0.75rem;
            color: #888;
        }
        .booster-card-fallback .card-rarity {
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
        }
        .booster-pack-header {
            padding: 16px 16px 0;
        }
        .booster-pack-header h2 {
            margin: 0 0 4px;
            color: #e0e0e0;
        }
        .booster-pack-header .pack-info {
            color: #888;
            font-size: 0.85rem;
        }
        .pack-history {
            margin-top: 12px;
            border-top: 1px solid #0f3460;
            padding-top: 8px;
        }
        .pack-history-title {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 6px;
            text-transform: uppercase;
        }
        .pack-history-item {
            padding: 6px 8px;
            font-size: 0.8rem;
            color: #aaa;
            cursor: pointer;
            border-radius: 4px;
        }
        .pack-history-item:hover {
            background: #16213e;
            color: #e0e0e0;
        }
        .pack-history-item.active {
            background: #0f3460;
            color: #4cc9f0;
        }
        .wordcloud-container {
            width: 100%;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .wordcloud-container svg text {
            cursor: default;
            transition: opacity 0.15s;
        }
        .wordcloud-container svg text:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h1 onclick="showHomeScreen()">MTG Deck Viewer</h1>
        <div class="tab-bar">
            <button class="tab-btn active" data-tab="decks" onclick="switchTab('decks')">Decks</button>
            <button class="tab-btn" data-tab="prices" onclick="switchTab('prices')">Prices</button>
            <button class="tab-btn" data-tab="sets" onclick="switchTab('sets')">Sets</button>
            <button class="tab-btn" data-tab="draft" onclick="switchTab('draft')">Draft</button>
        </div>
        <div id="decksTab">
            <div class="search-box">
                <input type="text" id="search" placeholder="Search decks...">
            </div>
            <div class="filter-box">
                <label>Format legality</label>
                <select id="formatFilter" onchange="applyFilters()">
                    <option value="">All formats</option>
                    <option value="standard">Standard</option>
                    <option value="pioneer">Pioneer</option>
                    <option value="modern">Modern</option>
                    <option value="legacy">Legacy</option>
                    <option value="vintage">Vintage</option>
                    <option value="commander">Commander</option>
                    <option value="brawl">Brawl</option>
                    <option value="historic">Historic</option>
                    <option value="pauper">Pauper</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Source</label>
                <select id="sourceFilter" onchange="applyFilters()">
                    <option value="">All sources</option>
                    <option value="precon">Preconstructed</option>
                    <option value="user">User created</option>
                    <option value="import">Imported</option>
                    <option value="test">Test</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Set</label>
                <select id="setFilter" onchange="applyFilters()">
                    <option value="">All sets</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Deck size</label>
                <select id="cardCountFilter" onchange="applyFilters()">
                    <option value="">Any size</option>
                    <option value="lands5">Land Pack (5)</option>
                    <option value="sample">Sample (6-20)</option>
                    <option value="limited">Limited (21-50)</option>
                    <option value="constructed">Constructed (51-75)</option>
                    <option value="commander">Commander (76-115)</option>
                    <option value="large">Large (116-299)</option>
                    <option value="cube">Cube (300+)</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Deck price (paper)</label>
                <select id="deckPriceFilter" onchange="applyFilters()">
                    <option value="">Any price</option>
                    <option value="1000">$1000+</option>
                    <option value="500">$500 - $1000</option>
                    <option value="100">$100 - $500</option>
                    <option value="50">$50 - $100</option>
                    <option value="0">Under $50</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Colors</label>
                <div class="color-filter" id="colorFilter">
                    <label class="color-checkbox"><input type="checkbox" value="W" onchange="applyFilters()"><i class="ms ms-w ms-cost"></i></label>
                    <label class="color-checkbox"><input type="checkbox" value="U" onchange="applyFilters()"><i class="ms ms-u ms-cost"></i></label>
                    <label class="color-checkbox"><input type="checkbox" value="B" onchange="applyFilters()"><i class="ms ms-b ms-cost"></i></label>
                    <label class="color-checkbox"><input type="checkbox" value="R" onchange="applyFilters()"><i class="ms ms-r ms-cost"></i></label>
                    <label class="color-checkbox"><input type="checkbox" value="G" onchange="applyFilters()"><i class="ms ms-g ms-cost"></i></label>
                    <label class="color-checkbox"><input type="checkbox" value="C" onchange="applyFilters()"><i class="ms ms-c ms-cost"></i></label>
                </div>
            </div>
            <div class="filter-box">
                <label>Sort by</label>
                <select id="sortBy" onchange="applyFilters()">
                    <option value="name">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                    <option value="release_date-desc">Release (Newest)</option>
                    <option value="release_date">Release (Oldest)</option>
                    <option value="card_count-desc">Cards (Most)</option>
                    <option value="card_count">Cards (Least)</option>
                </select>
            </div>
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px;">
                <div class="deck-count" id="deckCount">Loading...</div>
                <div style="display:flex;gap:4px;">
                    <button class="raw-btn" style="padding:6px 14px;font-size:0.8rem;background:#4cc9f0;color:#0a0a23;" onclick="showCreateDeckModal()">+ New Deck</button>
                    <button class="raw-btn" style="padding:6px 14px;font-size:0.8rem;" onclick="showImportDeckModal()">Import</button>
                </div>
            </div>
            <div class="deck-list" id="deckList">
                <div class="loading">Loading decks...</div>
            </div>
            <div class="pagination" id="deckPagination" style="display: none;">
                <button onclick="changeDeckPage(-1)" id="deckPrevBtn">Prev</button>
                <span id="deckPageInfo">Page 1</span>
                <button onclick="changeDeckPage(1)" id="deckNextBtn">Next</button>
            </div>
        </div>
        <div id="pricesTab" style="display: none;">
            <div class="search-box">
                <input type="text" id="priceSearch" placeholder="Search by name..." oninput="debounceSearchPrices()">
            </div>
            <div class="filter-box">
                <label>Sort by</label>
                <select id="priceSort" onchange="searchPrices()">
                    <option value="average_usd-desc">Price (Highest)</option>
                    <option value="average_usd">Price (Lowest)</option>
                    <option value="name">Name (A-Z)</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Price range</label>
                <select id="priceRange" onchange="searchPrices()">
                    <option value="">All prices</option>
                    <option value="1000">$1000+</option>
                    <option value="100">$100 - $1000</option>
                    <option value="10">$10 - $100</option>
                    <option value="1">$1 - $10</option>
                    <option value="0">Under $1</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Set</label>
                <select id="priceSetFilter" onchange="searchPrices()">
                    <option value="">All sets</option>
                </select>
            </div>
            <div class="deck-count" id="priceCount">Search to explore prices</div>
            <div class="deck-list" id="priceList"></div>
            <div class="pagination" id="pricePagination" style="display: none;">
                <button onclick="changePricePage(-1)" id="pricePrevBtn">Prev</button>
                <span id="pricePageInfo">Page 1</span>
                <button onclick="changePricePage(1)" id="priceNextBtn">Next</button>
            </div>
        </div>
        <div id="setsTab" style="display: none;">
            <div class="search-box">
                <input type="text" id="setSearch" placeholder="Search sets..." oninput="debounceSearchSets()">
            </div>
            <div class="filter-box">
                <label>Type</label>
                <select id="setTypeFilter" onchange="applySetFilters()">
                    <option value="">All types</option>
                    <option value="core">Core</option>
                    <option value="expansion">Expansion</option>
                    <option value="masters">Masters</option>
                    <option value="draft_innovation">Draft Innovation</option>
                    <option value="commander">Commander</option>
                    <option value="starter">Starter</option>
                    <option value="promo">Promo</option>
                    <option value="token">Token</option>
                    <option value="memorabilia">Memorabilia</option>
                </select>
            </div>
            <div class="filter-box">
                <label>Sort by</label>
                <select id="setSortBy" onchange="applySetFilters()">
                    <option value="release_date-desc">Release (Newest)</option>
                    <option value="release_date">Release (Oldest)</option>
                    <option value="name">Name (A-Z)</option>
                    <option value="name-desc">Name (Z-A)</option>
                </select>
            </div>
            <div class="deck-count" id="setCount">Loading...</div>
            <div class="deck-list" id="setList">
                <div class="loading">Loading sets...</div>
            </div>
            <div class="pagination" id="setPagination" style="display: none;">
                <button onclick="changeSetPage(-1)" id="setPrevBtn">Prev</button>
                <span id="setPageInfo">Page 1</span>
                <button onclick="changeSetPage(1)" id="setNextBtn">Next</button>
            </div>
        </div>
        <div id="draftTab" style="display: none;">
            <div class="draft-controls">
                <div class="filter-box">
                    <label>Set</label>
                    <input type="text" id="draftSetSearch" placeholder="Search sets..." list="draftSetList" oninput="filterDraftSets()">
                    <datalist id="draftSetList"></datalist>
                    <select id="draftSetSelect" style="margin-top:4px;">
                        <option value="">Select a set...</option>
                    </select>
                </div>
                <div class="filter-box">
                    <label>Booster Type</label>
                    <select id="draftBoosterType">
                        <option value="">Auto-detect</option>
                        <option value="play">Play Booster</option>
                        <option value="draft">Draft Booster</option>
                    </select>
                </div>
                <div class="filter-box">
                    <label>Packs</label>
                    <select id="draftPackCount">
                        <option value="1">1 pack</option>
                        <option value="3">3 packs</option>
                        <option value="6" selected>6 packs (sealed)</option>
                        <option value="12">12 packs</option>
                        <option value="24">24 packs (box)</option>
                        <option value="36">36 packs (box)</option>
                    </select>
                </div>
                <button onclick="openBoosterPacks()" id="openPacksBtn">Open Packs</button>
            </div>
            <div class="pack-history" id="packHistory" style="display:none;">
                <div class="pack-history-title">Opened Packs</div>
                <div id="packHistoryList"></div>
            </div>
        </div>
    </div>
    <div class="main-content" id="mainContent">
        <div class="loading">Loading...</div>
    </div>

    <button class="help-btn" onclick="openGlossary()">?</button>

    <div class="glossary-modal" id="glossaryModal" onclick="closeGlossary(event)">
        <div class="glossary-content" onclick="event.stopPropagation()">
            <div class="glossary-header">
                <h3>MTG Glossary</h3>
                <button class="modal-close" onclick="closeGlossary()">&times;</button>
            </div>
            <div class="glossary-search">
                <input type="text" id="glossarySearch" placeholder="Search terms..." oninput="filterGlossary()">
            </div>
            <div class="glossary-body" id="glossaryBody"></div>
        </div>
    </div>

    <!-- Deck Picker Modal -->
    <div class="modal" id="deckPickerModal" onclick="closeDeckPicker(event)">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-width:400px;">
            <div class="modal-header">
                <h3 id="deckPickerTitle">Add to Deck</h3>
                <button class="modal-close" onclick="closeDeckPicker()">&times;</button>
            </div>
            <div class="modal-body" style="padding:16px;">
                <div id="deckPickerCardInfo" style="margin-bottom:12px;font-size:0.85rem;color:#aaa;"></div>
                <div style="display:flex;gap:8px;margin-bottom:12px;">
                    <select id="deckPickerBoard" style="flex:1;padding:6px 8px;background:#16213e;border:1px solid #1a1a2e;border-radius:6px;color:#e0e0e0;font-size:0.85rem;">
                        <option value="main">Main Board</option>
                        <option value="side">Sideboard</option>
                        <option value="commander">Commander</option>
                    </select>
                    <input type="number" id="deckPickerCount" value="1" min="1" max="99" style="width:60px;padding:6px 8px;background:#16213e;border:1px solid #1a1a2e;border-radius:6px;color:#e0e0e0;font-size:0.85rem;text-align:center;">
                </div>
                <div id="deckPickerList" style="max-height:300px;overflow-y:auto;"></div>
                <div style="margin-top:12px;border-top:1px solid #1a1a2e;padding-top:12px;">
                    <button class="raw-btn" style="width:100%;padding:8px;font-size:0.85rem;background:#16213e;border:1px solid #4cc9f0;color:#4cc9f0;" onclick="quickCreateDeckFromPicker()">+ Create New Deck</button>
                </div>
                <div id="deckPickerStatus" style="margin-top:8px;font-size:0.85rem;text-align:center;"></div>
            </div>
        </div>
    </div>

    <!-- Create Deck Modal -->
    <div class="modal" id="createDeckModal" onclick="closeCreateDeckModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()" style="max-width:400px;">
            <div class="modal-header">
                <h3>Create New Deck</h3>
                <button class="modal-close" onclick="closeCreateDeckModal()">&times;</button>
            </div>
            <div class="modal-body" style="padding:16px;">
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.85rem;color:#aaa;display:block;margin-bottom:4px;">Deck Name</label>
                    <input type="text" id="createDeckName" placeholder="My Deck" style="width:100%;padding:8px 12px;background:#16213e;border:1px solid #1a1a2e;border-radius:6px;color:#e0e0e0;font-size:0.9rem;">
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.85rem;color:#aaa;display:block;margin-bottom:4px;">Format</label>
                    <select id="createDeckFormat" style="width:100%;padding:8px 12px;background:#16213e;border:1px solid #1a1a2e;border-radius:6px;color:#e0e0e0;font-size:0.9rem;">
                        <option value="">None</option>
                        <option value="standard">Standard</option>
                        <option value="pioneer">Pioneer</option>
                        <option value="modern">Modern</option>
                        <option value="legacy">Legacy</option>
                        <option value="vintage">Vintage</option>
                        <option value="commander">Commander</option>
                        <option value="pauper">Pauper</option>
                    </select>
                </div>
                <div style="margin-bottom:12px;">
                    <label style="font-size:0.85rem;color:#aaa;display:block;margin-bottom:4px;">Description (optional)</label>
                    <input type="text" id="createDeckDesc" placeholder="" style="width:100%;padding:8px 12px;background:#16213e;border:1px solid #1a1a2e;border-radius:6px;color:#e0e0e0;font-size:0.9rem;">
                </div>
                <button class="raw-btn" style="width:100%;padding:10px;font-size:0.9rem;background:#4cc9f0;color:#0a0a23;" onclick="submitCreateDeck()">Create Deck</button>
                <div id="createDeckStatus" style="margin-top:8px;font-size:0.85rem;text-align:center;color:#aaa;"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">JSON</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <pre id="modalJson"></pre>
            </div>
        </div>
    </div>

    <script src="/web/card-detail.js"></script>
    <script>
        // API Base URL
        const API_BASE = '/api';

        // State
        let currentDeck = null;
        let currentSet = null;
        let cardDataMap = {};
        let keywordsData = null;

        // Pagination state
        let deckPage = 1;
        let deckTotalPages = 1;
        let setPage = 1;
        let setTotalPages = 1;
        let pricePage = 1;
        let priceTotalPages = 1;

        // Debounce timer
        let searchDebounceTimer = null;

        // ========================================
        // API Client Functions
        // ========================================

        async function api(endpoint, params = {}, method = 'GET') {
            const url = new URL(API_BASE + endpoint, window.location.origin);
            const options = { method };
            if (method === 'GET') {
                Object.entries(params).forEach(([key, value]) => {
                    if (value !== null && value !== undefined && value !== '') {
                        url.searchParams.set(key, value);
                    }
                });
            } else {
                options.headers = { 'Content-Type': 'application/json' };
                options.body = JSON.stringify(params);
            }
            const response = await fetch(url, options);
            if (!response.ok) {
                throw new Error(`API error: ${response.status}`);
            }
            return response.json();
        }

        // ========================================
        // Utility Functions
        // ========================================

        function formatPrice(price) {
            if (price === null || price === undefined) return null;
            if (price >= 1000) return '$' + (price / 1000).toFixed(1) + 'k';
            if (price >= 100) return '$' + Math.round(price);
            if (price >= 1) return '$' + price.toFixed(2);
            return '$' + price.toFixed(2);
        }

        function renderSetCode(code, clickable = true) {
            const lowerCode = (code || '').toLowerCase();
            const icon = `<i class="ss ss-${lowerCode}"></i>`;
            return `${icon} ${code}`;
        }

        function copyUuid(uuid) {
            navigator.clipboard.writeText(uuid).then(() => {
                const el = event.currentTarget.querySelector('.uuid-copy');
                if (el) {
                    const original = el.textContent;
                    el.textContent = 'Copied!';
                    setTimeout(() => el.textContent = original, 1000);
                }
            });
        }

        function debounce(func, wait) {
            return function(...args) {
                clearTimeout(searchDebounceTimer);
                searchDebounceTimer = setTimeout(() => func.apply(this, args), wait);
            };
        }

        const debounceSearchPrices = debounce(searchPrices, 300);
        const debounceSearchSets = debounce(applySetFilters, 300);

        // ========================================
        // Tab Switching
        // ========================================

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.getElementById('decksTab').style.display = tab === 'decks' ? 'flex' : 'none';
            document.getElementById('pricesTab').style.display = tab === 'prices' ? 'flex' : 'none';
            document.getElementById('setsTab').style.display = tab === 'sets' ? 'flex' : 'none';
            document.getElementById('draftTab').style.display = tab === 'draft' ? 'flex' : 'none';

            if (tab === 'prices') {
                showPriceExplorer();
            } else if (tab === 'sets') {
                showSetsExplorer();
            } else if (tab === 'draft') {
                showDraftTab();
            } else {
                showHomeScreen();
            }
        }

        // ========================================
        // Decks Tab
        // ========================================

        async function loadDecks() {
            try {
                const query = document.getElementById('search').value;
                const format = document.getElementById('formatFilter').value;
                const source = document.getElementById('sourceFilter').value;
                const set = document.getElementById('setFilter').value;
                const cardCountFilter = document.getElementById('cardCountFilter').value;
                const priceRange = document.getElementById('deckPriceFilter').value;
                const sortValue = document.getElementById('sortBy').value;
                const selectedColors = Array.from(document.querySelectorAll('#colorFilter input:checked')).map(cb => cb.value).join('');

                const [sort, order] = sortValue.includes('-desc')
                    ? [sortValue.replace('-desc', ''), 'desc']
                    : [sortValue, 'asc'];

                let priceMin = null, priceMax = null;
                if (priceRange === '1000') { priceMin = 1000; }
                else if (priceRange === '500') { priceMin = 500; priceMax = 1000; }
                else if (priceRange === '100') { priceMin = 100; priceMax = 500; }
                else if (priceRange === '50') { priceMin = 50; priceMax = 100; }
                else if (priceRange === '0') { priceMax = 50; }

                let cardCountMin = null, cardCountMax = null;
                if (cardCountFilter === 'lands5') { cardCountMin = 5; cardCountMax = 5; }
                else if (cardCountFilter === 'sample') { cardCountMin = 6; cardCountMax = 20; }
                else if (cardCountFilter === 'limited') { cardCountMin = 21; cardCountMax = 50; }
                else if (cardCountFilter === 'constructed') { cardCountMin = 51; cardCountMax = 75; }
                else if (cardCountFilter === 'commander') { cardCountMin = 76; cardCountMax = 115; }
                else if (cardCountFilter === 'large') { cardCountMin = 116; cardCountMax = 299; }
                else if (cardCountFilter === 'cube') { cardCountMin = 300; }

                const data = await api('/decks', {
                    q: query,
                    format,
                    source,
                    set,
                    colors: selectedColors,
                    card_count_min: cardCountMin,
                    card_count_max: cardCountMax,
                    price_min: priceMin,
                    price_max: priceMax,
                    sort,
                    order,
                    page: deckPage,
                    limit: 50
                });

                renderDeckList(data);
                populateSetFilter(data.filters?.sets || []);
            } catch (error) {
                console.error('Error loading decks:', error);
                document.getElementById('deckList').innerHTML = '<div class="loading">Error loading decks</div>';
            }
        }

        function renderDeckList(data) {
            const container = document.getElementById('deckList');
            const decks = data.data || [];
            const pagination = data.pagination || {};

            deckTotalPages = pagination.pages || 1;
            document.getElementById('deckCount').textContent = `${pagination.total || decks.length} decks`;

            updatePagination('deck', pagination);

            if (decks.length === 0) {
                container.innerHTML = '<div class="loading">No decks found</div>';
                return;
            }

            container.innerHTML = decks.map(deck => {
                const colors = deck.colors || [];
                const manaIcons = colors.map(c => `<i class="ms ms-${c.toLowerCase()} ms-cost ms-shadow"></i>`).join('');
                const price = deck.price ? formatPrice(deck.price) : '';
                return `
                    <div class="deck-item" data-file="${deck.file}" onclick="loadDeck('${deck.file}')">
                        <div class="deck-name">${deck.name} <span class="deck-colors">${manaIcons}</span></div>
                        <div class="deck-code">
                            <span>${renderSetCode(deck.code)} ${deck.card_count} cards</span>
                            <span class="deck-price">${price}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function populateSetFilter(sets) {
            const select = document.getElementById('setFilter');
            if (select.options.length > 1) return;
            sets.forEach(code => {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = code;
                select.appendChild(option);
            });
        }

        function applyFilters() {
            deckPage = 1;
            loadDecks();
        }

        function changeDeckPage(delta) {
            deckPage = Math.max(1, Math.min(deckTotalPages, deckPage + delta));
            loadDecks();
        }

        async function loadDeck(filename) {
            document.querySelectorAll('.deck-item').forEach(el => {
                el.classList.toggle('active', el.dataset.file === filename);
            });

            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = '<div class="loading">Loading deck...</div>';

            try {
                const deckData = await api(`/decks/${filename}`);
                currentDeck = deckData;
                renderDeck(deckData);
            } catch (error) {
                mainContent.innerHTML = '<div class="loading">Error loading deck</div>';
            }
        }

        function renderDeck(deck) {
            cardDataMap = {};
            const mainContent = document.getElementById('mainContent');
            const stats = deck.stats || {};
            const price = deck.price || {};

            let html = `
                <div class="deck-header">
                    <h2>${deck.meta?.name || 'Deck'} <button class="raw-btn" onclick="showDeckRaw()">raw</button></h2>
                    <div class="deck-meta">
                        Set: ${renderSetCode(deck.meta?.code)}
                        ${deck.meta?.release_date ? `Released: ${deck.meta.release_date}` : ''}
                    </div>
                </div>
                ${renderDeckStats(stats, deck.legality, price)}
            `;

            if (deck.commander && deck.commander.length > 0) {
                html += `
                    <div class="section">
                        <h3>Commander (${deck.commander.length})</h3>
                        <div class="cards-grid">
                            ${deck.commander.map(card => renderCard(card)).join('')}
                        </div>
                    </div>
                `;
            }

            if (deck.main_board && deck.main_board.length > 0) {
                const mainCount = deck.main_board.reduce((sum, c) => sum + (c.count || 1), 0);
                html += `
                    <div class="section">
                        <h3>Main Board (${mainCount} cards)</h3>
                        <div class="cards-grid">
                            ${deck.main_board.map(card => renderCard(card)).join('')}
                        </div>
                    </div>
                `;
            }

            if (deck.side_board && deck.side_board.length > 0) {
                const sideCount = deck.side_board.reduce((sum, c) => sum + (c.count || 1), 0);
                html += `
                    <div class="section">
                        <h3>Sideboard (${sideCount} cards)</h3>
                        <div class="cards-grid">
                            ${deck.side_board.map(card => renderCard(card)).join('')}
                        </div>
                    </div>
                `;
            }

            mainContent.innerHTML = html;

            // Render visualizations
            if (stats.price_histogram) {
                renderHistogram(stats.price_histogram, '#price-histogram');
            }
            if (stats.keywords?.keyword_abilities) {
                renderWordCloud(stats.keywords.keyword_abilities, '#deck-kw-abilities');
            }
            if (stats.keywords?.keyword_actions) {
                renderWordCloud(stats.keywords.keyword_actions, '#deck-kw-actions');
            }
        }

        function renderDeckStats(stats, legality, price) {
            const manaCurve = stats.mana_curve || {};
            const maxCurve = Math.max(...Object.values(manaCurve), 1);

            const ALL_FORMATS = ['standard', 'pioneer', 'modern', 'legacy', 'vintage', 'commander', 'brawl', 'historic', 'pauper'];

            return `
                <div class="deck-stats">
                    <div class="stat-card">
                        <h4>Overview</h4>
                        <div class="stat-row"><span>Total Cards</span><span>${stats.total_cards || 0}</span></div>
                        <div class="stat-row"><span>Unique Cards</span><span>${stats.unique_cards || 0}</span></div>
                    </div>

                    <div class="stat-card">
                        <h4>Prices</h4>
                        ${price.by_source ? Object.entries(price.by_source).map(([source, val]) => `
                            <div class="stat-row"><span>${source}</span><span>${formatPrice(val)}</span></div>
                        `).join('') : '<div class="stat-row">No price data</div>'}
                        ${price.total ? `<div class="stat-row"><span><strong>Total</strong></span><span><strong>${formatPrice(price.total)}</strong></span></div>` : ''}
                    </div>

                    <div class="stat-card">
                        <h4>Mana Curve</h4>
                        <div class="mana-curve">
                            ${Object.entries(manaCurve).map(([mv, count]) => `
                                <div class="mana-bar">
                                    <span class="mana-bar-count">${count}</span>
                                    <div class="mana-bar-fill" style="height: ${(count / maxCurve) * 70}px"></div>
                                    <span class="mana-bar-label">${mv}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <div class="stat-card">
                        <h4>Price Distribution</h4>
                        <div id="price-histogram"></div>
                    </div>

                    <div class="stat-card">
                        <h4>Colors</h4>
                        <div class="color-pie">
                            ${stats.color_distribution ? Object.entries(stats.color_distribution)
                                .filter(([_, count]) => count > 0)
                                .map(([color, count]) => `
                                    <div class="color-stat">
                                        <i class="ms ms-${color.toLowerCase()} ms-cost ms-shadow"></i>
                                        ${count}
                                    </div>
                                `).join('') : ''}
                        </div>
                    </div>

                    <div class="stat-card">
                        <h4>Card Types</h4>
                        ${stats.type_distribution ? Object.entries(stats.type_distribution)
                            .sort((a, b) => b[1] - a[1])
                            .slice(0, 6)
                            .map(([type, count]) => `
                                <div class="stat-row"><span>${type}</span><span>${count}</span></div>
                            `).join('') : ''}
                    </div>

                    <div class="stat-card">
                        <h4>Rarities</h4>
                        ${stats.rarity_distribution ? Object.entries(stats.rarity_distribution)
                            .map(([rarity, count]) => `
                                <div class="stat-row"><span>${rarity}</span><span>${count}</span></div>
                            `).join('') : ''}
                    </div>

                    <div class="stat-card">
                        <h4>Format Legality</h4>
                        <div class="legality-grid">
                            ${legality ? ALL_FORMATS.map(fmt => `
                                <span class="legality-badge ${legality[fmt] ? 'legal' : 'not-legal'}">
                                    ${fmt.charAt(0).toUpperCase() + fmt.slice(1)}
                                </span>
                            `).join('') : ''}
                        </div>
                    </div>

                    ${stats.keywords?.keyword_abilities && Object.keys(stats.keywords.keyword_abilities).length > 0 ? `
                    <div class="stat-card stat-card-2col">
                        <h4>Keyword Abilities</h4>
                        <div class="wordcloud-container" id="deck-kw-abilities"></div>
                    </div>` : ''}

                    ${stats.keywords?.keyword_actions && Object.keys(stats.keywords.keyword_actions).length > 0 ? `
                    <div class="stat-card stat-card-2col">
                        <h4>Keyword Actions</h4>
                        <div class="wordcloud-container" id="deck-kw-actions"></div>
                    </div>` : ''}
                </div>
            `;
        }

        function showDeckRaw() {
            if (!currentDeck) return;
            document.getElementById('modalTitle').textContent = currentDeck.meta?.name || 'Deck JSON';
            document.getElementById('modalJson').innerHTML = renderJson(currentDeck);
            document.getElementById('modal').classList.add('active');
        }

        // ========================================
        // Sets Tab
        // ========================================

        async function loadSets() {
            try {
                const query = document.getElementById('setSearch').value;
                const type = document.getElementById('setTypeFilter').value;
                const sortValue = document.getElementById('setSortBy').value;

                const [sort, order] = sortValue.includes('-desc')
                    ? [sortValue.replace('-desc', ''), 'desc']
                    : [sortValue, 'asc'];

                const data = await api('/sets', {
                    q: query,
                    type,
                    sort,
                    order,
                    page: setPage,
                    limit: 50
                });

                renderSetList(data);
            } catch (error) {
                console.error('Error loading sets:', error);
                document.getElementById('setList').innerHTML = '<div class="loading">Error loading sets</div>';
            }
        }

        function renderSetList(data) {
            const container = document.getElementById('setList');
            const sets = data.data || [];
            const pagination = data.pagination || {};

            setTotalPages = pagination.pages || 1;
            document.getElementById('setCount').textContent = `${pagination.total || sets.length} sets`;

            updatePagination('set', pagination);

            if (sets.length === 0) {
                container.innerHTML = '<div class="loading">No sets found</div>';
                return;
            }

            container.innerHTML = sets.map(set => {
                const typeLabel = set.type ? set.type.charAt(0).toUpperCase() + set.type.slice(1).replace('_', ' ') : '';
                return `
                    <div class="deck-item" onclick="loadSet('${set.code}')">
                        <div class="deck-name">${renderSetCode(set.code)} ${set.name}</div>
                        <div class="deck-code">${typeLabel} ${set.base_set_size} cards ${set.release_date || ''}</div>
                    </div>
                `;
            }).join('');
        }

        function applySetFilters() {
            setPage = 1;
            loadSets();
        }

        function changeSetPage(delta) {
            setPage = Math.max(1, Math.min(setTotalPages, setPage + delta));
            loadSets();
        }

        async function loadSet(code) {
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = '<div class="loading">Loading set...</div>';

            try {
                const setData = await api(`/sets/${code}`);
                currentSet = setData;
                renderSetView(setData);
            } catch (error) {
                mainContent.innerHTML = '<div class="loading">Error loading set</div>';
            }
        }

        function renderSetView(setData) {
            const mainContent = document.getElementById('mainContent');
            const meta = setData.meta || {};
            const stats = setData.stats || {};
            const cards = setData.cards?.data || [];

            const typeLabel = meta.type ? meta.type.charAt(0).toUpperCase() + meta.type.slice(1).replace('_', ' ') : '';

            mainContent.innerHTML = `
                <div class="deck-header">
                    <h2>${renderSetCode(meta.code)} ${meta.name} <button class="raw-btn" onclick="showSetRaw()">raw</button></h2>
                    <div class="deck-meta">
                        ${typeLabel} Released ${meta.release_date || 'Unknown'}
                        ${meta.block ? ` ${meta.block}` : ''}
                    </div>
                </div>

                <div class="deck-stats">
                    <div class="stat-card">
                        <h4>Set Size</h4>
                        <div class="stat-row"><span>Base Set</span><span>${meta.base_set_size || 0}</span></div>
                        <div class="stat-row"><span>Total (with variants)</span><span>${meta.total_set_size || 0}</span></div>
                    </div>

                    <div class="stat-card">
                        <h4>Prices</h4>
                        ${stats.price?.total ? `<div class="stat-row"><span>Total</span><span>${formatPrice(stats.price.total)}</span></div>` : ''}
                        ${stats.price?.by_source ? Object.entries(stats.price.by_source).filter(([k,v]) => v !== null).map(([source, val]) => `
                            <div class="stat-row"><span>${source}</span><span>${formatPrice(val)}</span></div>
                        `).join('') : ''}
                        ${!stats.price?.total && !Object.values(stats.price?.by_source || {}).some(v => v !== null) ? '<div class="stat-row">No price data</div>' : ''}
                    </div>

                    <div class="stat-card">
                        <h4>Rarity Breakdown</h4>
                        ${stats.rarity_count ? Object.entries(stats.rarity_count).map(([rarity, count]) => `
                            <div class="stat-row"><span>${rarity}</span><span>${count}</span></div>
                        `).join('') : ''}
                    </div>

                    ${stats.keywords?.keyword_abilities && Object.keys(stats.keywords.keyword_abilities).length > 0 ? `
                    <div class="stat-card">
                        <h4>Keyword Abilities</h4>
                        <div class="wordcloud-container" id="set-kw-abilities"></div>
                    </div>` : ''}

                    ${stats.keywords?.keyword_actions && Object.keys(stats.keywords.keyword_actions).length > 0 ? `
                    <div class="stat-card">
                        <h4>Keyword Actions</h4>
                        <div class="wordcloud-container" id="set-kw-actions"></div>
                    </div>` : ''}
                </div>

                <h3 style="margin: 20px 0 10px; color: #e94560;">Cards (${cards.length})</h3>
                <div class="cards-grid">
                    ${cards.map(card => renderCard(card)).join('')}
                </div>
            `;

            // Render wordclouds after innerHTML is set
            if (stats.keywords?.keyword_abilities) {
                renderWordCloud(stats.keywords.keyword_abilities, '#set-kw-abilities');
            }
            if (stats.keywords?.keyword_actions) {
                renderWordCloud(stats.keywords.keyword_actions, '#set-kw-actions');
            }
        }

        function showSetRaw() {
            if (!currentSet) return;
            document.getElementById('modalTitle').textContent = currentSet.meta?.name || 'Set JSON';
            document.getElementById('modalJson').innerHTML = renderJson(currentSet);
            document.getElementById('modal').classList.add('active');
        }

        function showSetsExplorer() {
            loadSets();
            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="home-screen">
                    <div class="home-header">
                        <h2>Sets Explorer</h2>
                        <p>Browse Magic: The Gathering sets</p>
                    </div>
                    <p style="color: #888; text-align: center;">Select a set from the sidebar to view details.</p>
                </div>
            `;
        }

        // ========================================
        // Prices Tab
        // ========================================

        async function searchPrices() {
            const query = document.getElementById('priceSearch').value;
            const sortValue = document.getElementById('priceSort').value;
            const range = document.getElementById('priceRange').value;
            const setFilter = document.getElementById('priceSetFilter').value;

            const [sort, order] = sortValue.includes('-desc')
                ? [sortValue.replace('-desc', ''), 'desc']
                : [sortValue, 'asc'];

            let priceMin = null, priceMax = null;
            if (range === '1000') { priceMin = 1000; }
            else if (range === '100') { priceMin = 100; priceMax = 1000; }
            else if (range === '10') { priceMin = 10; priceMax = 100; }
            else if (range === '1') { priceMin = 1; priceMax = 10; }
            else if (range === '0') { priceMax = 1; }

            try {
                const data = await api('/prices', {
                    q: query,
                    set: setFilter,
                    price_min: priceMin,
                    price_max: priceMax,
                    sort,
                    order,
                    page: pricePage,
                    limit: 50
                });

                renderPriceList(data);
            } catch (error) {
                console.error('Error searching prices:', error);
                document.getElementById('priceList').innerHTML = '<div class="loading">Error searching prices</div>';
            }
        }

        function renderPriceList(data) {
            const container = document.getElementById('priceList');
