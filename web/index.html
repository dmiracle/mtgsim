            const prices = data.data || [];
            const pagination = data.pagination || {};

            priceTotalPages = pagination.pages || 1;
            document.getElementById('priceCount').textContent = `${pagination.total || prices.length} cards`;

            updatePagination('price', pagination);

            if (prices.length === 0) {
                container.innerHTML = '<div class="loading">No results found</div>';
                return;
            }

            container.innerHTML = prices.map(p => `
                <div class="deck-item" onclick="showPriceCard('${p.uuid}')">
                    <div class="deck-name">${p.name}</div>
                    <div class="deck-code">
                        ${formatPrice(p.average_usd)}
                        ${p.set_code ? ` ${p.set_code}` : ''}
                        ${p.rarity ? ` ${p.rarity}` : ''}
                    </div>
                </div>
            `).join('');
        }

        function changePricePage(delta) {
            pricePage = Math.max(1, Math.min(priceTotalPages, pricePage + delta));
            searchPrices();
        }

        async function showPriceCard(uuid) {
            showCardDetail(uuid);
        }

        function renderPriceCardView(card) {
            const mainContent = document.getElementById('mainContent');
            cardDataMap[card.uuid] = card;

            const decksSection = card.deck_appearances && card.deck_appearances.length > 0 ? `
                <div class="section">
                    <h3>Appears in ${card.deck_appearances.length} deck${card.deck_appearances.length !== 1 ? 's' : ''}</h3>
                    <div class="decks-containing-card">
                        ${card.deck_appearances.map(deck => `
                            <div class="deck-item" onclick="loadDeck('${deck.file}'); switchTab('decks');">
                                <div class="deck-name">${deck.name}</div>
                                <div class="deck-code">${renderSetCode(deck.code)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : '<p style="color: #888; margin-top: 20px;">This card does not appear in any indexed deck.</p>';

        async function populatePriceSetFilter() {
            const select = document.getElementById('priceSetFilter');
            if (select.options.length > 1) return;
            try {
                const data = await api('/sets', { limit: 100, sort: 'release_date', order: 'desc' });
                const sets = data.data || [];
                for (const s of sets) {
                    const opt = document.createElement('option');
                    opt.value = s.code;
                    opt.textContent = `${s.name} (${s.code})`;
                    select.appendChild(opt);
                }
                // Fetch remaining pages
                if (sets.length === 100) {
                    let page = 2;
                    while (true) {
                        const more = await api('/sets', { limit: 100, sort: 'release_date', order: 'desc', page });
                        const moreSets = more.data || [];
                        for (const s of moreSets) {
                            const opt = document.createElement('option');
                            opt.value = s.code;
                            opt.textContent = `${s.name} (${s.code})`;
                            select.appendChild(opt);
                        }
                        if (moreSets.length < 100) break;
                        page++;
                    }
                }
            } catch (err) {
                console.error('Failed to load price set filter:', err);
            }
        }

        function renderHistogram(buckets, selector, width = 220, height = 100) {
            const container = d3.select(selector);
            container.selectAll('*').remove();

            if (!buckets || buckets.length === 0) {
                container.append('div').style('color', '#666').text('No data');
                return;
            }

            const margin = { top: 10, right: 10, bottom: 25, left: 35 };
            const innerWidth = width - margin.left - margin.right;
            const innerHeight = height - margin.top - margin.bottom;

            const svg = container.append('svg')
                .attr('width', width)
                .attr('height', height);

            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            const x = d3.scaleBand()
                .domain(buckets.map(b => b.range))
                .range([0, innerWidth])
                .padding(0.1);

            const y = d3.scaleLinear()
                .domain([0, d3.max(buckets, d => d.count)])
                .nice()
                .range([innerHeight, 0]);

            g.selectAll('rect')
                .data(buckets)
                .join('rect')
                .attr('x', d => x(d.range))
                .attr('width', x.bandwidth())
                .attr('y', d => y(d.count))
                .attr('height', d => innerHeight - y(d.count))
                .attr('fill', '#4ade80');

            g.append('g')
                .attr('transform', `translate(0,${innerHeight})`)
                .call(d3.axisBottom(x).tickSize(0))
                .selectAll('text')
                .style('fill', '#888')
                .style('font-size', '9px')
                .attr('transform', 'rotate(-45)')
                .attr('text-anchor', 'end');

            g.selectAll('.domain').style('stroke', '#444');

            g.append('g')
                .call(d3.axisLeft(y).ticks(4))
                .selectAll('text')
                .style('fill', '#888')
                .style('font-size', '10px');
        }

        function renderWordCloud(freqMap, selector) {
            const container = d3.select(selector);
            if (!container.node()) return;
            container.selectAll('*').remove();

            const entries = Object.entries(freqMap).filter(([_, v]) => v > 0);
            if (entries.length === 0) return;

            const width = container.node().getBoundingClientRect().width || 400;
            const height = Math.max(160, Math.min(250, entries.length * 12));

            const maxCount = Math.max(...entries.map(([_, v]) => v));
            const minCount = Math.min(...entries.map(([_, v]) => v));
            const sizeScale = d3.scaleLinear()
                .domain([minCount, Math.max(maxCount, minCount + 1)])
                .range([12, 32]);

            const colors = ['#4cc9f0', '#f4a261', '#e94560', '#4ade80', '#c084fc', '#60a5fa', '#f472b6'];

            const words = entries.map(([word, count], i) => ({
                text: word,
                size: sizeScale(count),
                count: count,
                color: colors[i % colors.length],
            }));

            const layout = d3.layout.cloud()
                .size([width, height])
                .words(words)
                .padding(4)
                .rotate(() => 0)
                .fontSize(d => d.size)
                .on('end', draw);

            layout.start();

            function draw(placed) {
                const svg = container.append('svg')
                    .attr('width', width)
                    .attr('height', height)
                    .style('overflow', 'hidden');

                svg.append('g')
                    .attr('transform', `translate(${width / 2},${height / 2})`)
                    .selectAll('text')
                    .data(placed)
                    .join('text')
                    .style('font-size', d => d.size + 'px')
                    .style('font-family', 'sans-serif')
                    .style('font-weight', '600')
                    .style('fill', d => d.color)
                    .attr('text-anchor', 'middle')
                    .attr('transform', d => `translate(${d.x},${d.y})`)
                    .text(d => d.text)
                    .append('title')
                    .text(d => `${d.text}: ${d.count}`);
            }
        }

        function renderJson(obj, indent = 0) {
            const type = Array.isArray(obj) ? 'array' : typeof obj;

            if (obj === null) return '<span class="json-null">null</span>';
            if (type === 'string') {
                const escaped = obj.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
                return `<span class="json-string">"${escaped}"</span>`;
            }
            if (type === 'number') return `<span class="json-number">${obj}</span>`;
            if (type === 'boolean') return `<span class="json-boolean">${obj}</span>`;

            if (type === 'array') {
                if (obj.length === 0) return '<span class="json-bracket">[]</span>';
                const id = 'j' + Math.random().toString(36).substr(2, 9);
                let html = `<span class="json-toggle" onclick="toggleJson('${id}')">-</span><span class="json-bracket">[</span>`;
                html += `<div class="json-collapsible" id="${id}">`;
                obj.forEach((item, i) => {
                    html += '  '.repeat(indent + 1) + renderJson(item, indent + 1);
                    if (i < obj.length - 1) html += ',';
                    html += '\n';
                });
                html += '  '.repeat(indent) + '</div><span class="json-ellipsis">...</span><span class="json-bracket">]</span>';
                return html;
            }

            if (type === 'object') {
                const keys = Object.keys(obj);
                if (keys.length === 0) return '<span class="json-bracket">{}</span>';
                const id = 'j' + Math.random().toString(36).substr(2, 9);
                let html = `<span class="json-toggle" onclick="toggleJson('${id}')">-</span><span class="json-bracket">{</span>`;
                html += `<div class="json-collapsible" id="${id}">`;
                keys.forEach((key, i) => {
                    const escapedKey = key.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    html += '  '.repeat(indent + 1) + `<span class="json-key">"${escapedKey}"</span>: `;
                    html += renderJson(obj[key], indent + 1);
                    if (i < keys.length - 1) html += ',';
                    html += '\n';
                });
                html += '  '.repeat(indent) + '</div><span class="json-ellipsis">...</span><span class="json-bracket">}</span>';
                return html;
            }

            return String(obj);
        }

        function toggleJson(id) {
            const el = document.getElementById(id);
            const toggle = el.previousElementSibling.previousElementSibling;
            el.classList.toggle('json-collapsed');
            toggle.textContent = el.classList.contains('json-collapsed') ? '+' : '-';
        }

                        <label style="font-size:0.85rem;color:#aaa;display:block;margin-bottom:4px;">Paste MTGA deck export or drop a .txt file</label>
                        <textarea id="importDeckText" rows="16" placeholder="Deck\n4 Lightning Bolt (2ED) 162\n4 Chain Lightning (LEG) 137\n...\n\nSideboard\n3 Smash to Smithereens (ORI) 163"
                            style="width:100%;padding:10px 12px;background:#16213e;border:1px solid #1a1a2e;border-radius:6px;color:#e0e0e0;font-family:monospace;font-size:0.85rem;resize:vertical;"
                            ondragover="event.preventDefault();this.style.borderColor='#4cc9f0'"
                            ondragleave="this.style.borderColor='#1a1a2e'"
                            ondrop="handleDeckFileDrop(event)"></textarea>
                    </div>
                    <div style="display:flex;gap:8px;align-items:center;">
                        <button class="raw-btn" style="padding:10px 20px;font-size:0.9rem;background:#4cc9f0;color:#0a0a23;" onclick="submitDeckImport()">Import</button>
                        <label class="raw-btn" style="padding:10px 20px;font-size:0.9rem;cursor:pointer;">
                            Browse File
                            <input type="file" accept=".txt,.dec,.dek" style="display:none;" onchange="handleDeckFileSelect(event)">
                        </label>
                        <span id="importStatus" style="font-size:0.85rem;color:#aaa;"></span>
                    </div>
                    <div id="importResult" style="margin-top:16px;"></div>
                </div>
            `;
        }

        function handleDeckFileDrop(event) {
            event.preventDefault();
            event.target.style.borderColor = '#1a1a2e';
            const file = event.dataTransfer.files[0];
            if (file) {
                file.text().then(text => {
                    document.getElementById('importDeckText').value = text;
                    if (!document.getElementById('importDeckName').value) {
                        document.getElementById('importDeckName').value = file.name.replace(/\.\w+$/, '');
                    }
                });
            }
        }

        function handleDeckFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                file.text().then(text => {
                    document.getElementById('importDeckText').value = text;
                    if (!document.getElementById('importDeckName').value) {
                        document.getElementById('importDeckName').value = file.name.replace(/\.\w+$/, '');
                    }
                });
            }
        }

        async function submitDeckImport() {
            const name = document.getElementById('importDeckName').value.trim();
            const text = document.getElementById('importDeckText').value.trim();
            const status = document.getElementById('importStatus');
            const resultDiv = document.getElementById('importResult');

            if (!name) { status.textContent = 'Deck name is required'; return; }
            if (!text) { status.textContent = 'Paste deck text first'; return; }

            status.textContent = 'Importing...';
            resultDiv.innerHTML = '';

            const result = await api('/decks/import', { text, name }, 'POST');

            status.textContent = '';
            const cards = result.resolved || [];
            const exact = cards.filter(c => c.match_type === 'exact');
            const fuzzy = cards.filter(c => c.match_type === 'fuzzy');
            const created = cards.filter(c => c.match_type === 'created');

            let html = `<div style="padding:12px;background:#16213e;border-radius:8px;">`;
            html += `<div style="color:#4cc9f0;font-weight:600;margin-bottom:8px;">Deck imported: ${escapeHtml(result.deck_name)}</div>`;
            html += `<div style="font-size:0.85rem;color:#aaa;">Total cards: ${result.total_cards} | Exact: ${exact.length} | Fuzzy: ${fuzzy.length} | Created: ${created.length}</div>`;

            if (fuzzy.length > 0) {
                html += `<div style="margin-top:8px;font-size:0.85rem;color:#f4a261;">Fuzzy matches:</div><ul style="margin:4px 0 0 16px;font-size:0.8rem;color:#e0e0e0;">`;
                for (const c of fuzzy) {
                    html += `<li>${escapeHtml(c.name)} → ${escapeHtml(c.matched_name)} (${Math.round(c.match_score)}%)</li>`;
                }
                html += `</ul>`;
            }

            if (created.length > 0) {
                html += `<div style="margin-top:8px;font-size:0.85rem;color:#e63946;">Not in database (placeholders created):</div><ul style="margin:4px 0 0 16px;font-size:0.8rem;color:#e0e0e0;">`;
                for (const c of created) {
                    html += `<li>${c.count}x ${escapeHtml(c.name)}</li>`;
                }
                html += `</ul>`;
            }

            if (result.legality && result.legality.length > 0) {
                html += `<div style="margin-top:12px;"><div style="font-size:0.85rem;color:#aaa;margin-bottom:6px;">Format Legality</div>`;
                html += `<div class="legalities-grid">`;
                for (const lr of result.legality) {
                    const cls = lr.legal ? 'legal' : 'banned';
                    const label = lr.legal ? 'Legal' : 'Not Legal';
                    html += `<div class="legality-item"><span class="format-name">${lr.format}</span><span class="legality-badge ${cls}" ${lr.reason ? `title="${escapeHtml(lr.reason)}"` : ''}>${label}</span></div>`;
                }
                html += `</div></div>`;
            }

            html += `<div style="margin-top:12px;"><button class="raw-btn" style="padding:6px 14px;font-size:0.85rem;" onclick="loadDeck('${result.deck_id}');">View Deck</button></div>`;
            html += `</div>`;
            resultDiv.innerHTML = html;
        }

        // ========================================
        // Deck Management (Create, Add Card)
        // ========================================

        let deckPickerCardUuid = null;
        let deckPickerCardName = '';
        let userDecksCache = null;

        async function loadUserDecks() {
            try {
                userDecksCache = await api('/decks/user/list');
            } catch (e) {
                userDecksCache = [];
            }
            return userDecksCache;
        }

        async function showDeckPicker(cardUuid, cardName) {
            deckPickerCardUuid = cardUuid;
            deckPickerCardName = cardName;
            document.getElementById('deckPickerCardInfo').textContent = `Adding: ${cardName}`;
            document.getElementById('deckPickerCount').value = 1;
            document.getElementById('deckPickerBoard').value = 'main';
            document.getElementById('deckPickerStatus').textContent = '';

            const decks = await loadUserDecks();
            const listEl = document.getElementById('deckPickerList');

            if (decks.length === 0) {
                listEl.innerHTML = '<div style="text-align:center;color:#666;padding:20px;font-size:0.85rem;">No decks yet. Create one below.</div>';
            } else {
                listEl.innerHTML = decks.map(d => `
                    <div class="deck-picker-item" onclick="addCardToDeck(${d.id}, '${d.name.replace(/'/g, "\\'")}')">
                        <span class="deck-picker-name">${escapeHtml(d.name)}</span>
                        <span class="deck-picker-meta">${d.card_count} cards${d.format ? ' · ' + d.format : ''}</span>
                    </div>
                `).join('');
            }

            document.getElementById('deckPickerModal').classList.add('active');
        }

        function closeDeckPicker(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('deckPickerModal').classList.remove('active');
        }

        async function addCardToDeck(deckId, deckName) {
            const count = parseInt(document.getElementById('deckPickerCount').value) || 1;
            const board = document.getElementById('deckPickerBoard').value;
            const statusEl = document.getElementById('deckPickerStatus');

            statusEl.textContent = 'Adding...';
            statusEl.style.color = '#aaa';

            try {
                await api(`/decks/${deckId}/cards`, {
                    card_uuid: deckPickerCardUuid,
                    count,
                    board,
                }, 'POST');
                statusEl.textContent = `Added ${count}x ${deckPickerCardName} to ${deckName}`;
                statusEl.style.color = '#4cc9f0';
                userDecksCache = null; // invalidate cache
                setTimeout(() => closeDeckPicker(), 1200);
            } catch (e) {
                statusEl.textContent = 'Error adding card';
                statusEl.style.color = '#e63946';
            }
        }

        async function quickCreateDeckFromPicker() {
            const name = prompt('Deck name:');
            if (!name) return;

            try {
                const deck = await api('/decks/create', { name }, 'POST');
                userDecksCache = null;
                await addCardToDeck(deck.id, deck.name);
                await showDeckPicker(deckPickerCardUuid, deckPickerCardName);
            } catch (e) {
                document.getElementById('deckPickerStatus').textContent = 'Error creating deck';
                document.getElementById('deckPickerStatus').style.color = '#e63946';
            }
        }

        function showCreateDeckModal() {
            document.getElementById('createDeckName').value = '';
            document.getElementById('createDeckFormat').value = '';
            document.getElementById('createDeckDesc').value = '';
            document.getElementById('createDeckStatus').textContent = '';
            document.getElementById('createDeckModal').classList.add('active');
        }

        function closeCreateDeckModal(event) {
            if (event && event.target !== event.currentTarget) return;
            document.getElementById('createDeckModal').classList.remove('active');
        }

        async function submitCreateDeck() {
            const name = document.getElementById('createDeckName').value.trim();
            const format = document.getElementById('createDeckFormat').value || null;
            const description = document.getElementById('createDeckDesc').value.trim() || null;
            const statusEl = document.getElementById('createDeckStatus');

            if (!name) { statusEl.textContent = 'Name is required'; return; }

            statusEl.textContent = 'Creating...';

            try {
                const deck = await api('/decks/create', { name, format, description }, 'POST');
                userDecksCache = null;
                closeCreateDeckModal();
                loadDeck(String(deck.id));
                loadDecks(); // refresh sidebar
            } catch (e) {
                statusEl.textContent = 'Error creating deck';
            }
        }

        // ========================================
        // Draft Tab
        // ========================================

        let draftSetsLoaded = false;
        let draftSetsData = [];
        let draftOpenedPacks = [];
        let draftCurrentPackIndex = -1;

        async function showDraftTab() {
            if (!draftSetsLoaded) {
                await loadDraftSets();
            }
            const mainContent = document.getElementById('mainContent');
            if (draftOpenedPacks.length === 0) {
                mainContent.innerHTML = `
                    <div class="home-screen">
                        <div class="home-header">
                            <h2>Draft Simulator</h2>
                            <p>Select a set and open booster packs</p>
                        </div>
                    </div>`;
            }
        }

        async function loadDraftSets() {
            try {
                let page = 1;
                let allSets = [];
                while (true) {
                    const data = await api('/sets', { limit: 100, sort: 'release_date', order: 'desc', page });
                    const sets = data.data || [];
                    allSets = allSets.concat(sets);
                    if (sets.length < 100) break;
                    page++;
                }
                draftSetsData = allSets;
                populateDraftSetSelect(draftSetsData);
                draftSetsLoaded = true;
            } catch (err) {
                console.error('Failed to load draft sets:', err);
            }
        }

        function populateDraftSetSelect(sets) {
            const select = document.getElementById('draftSetSelect');
            const datalist = document.getElementById('draftSetList');
            select.innerHTML = '<option value="">Select a set...</option>';
            datalist.innerHTML = '';
            for (const s of sets) {
                const opt = document.createElement('option');
                opt.value = s.code;
                opt.textContent = `${s.name} (${s.code})`;
                select.appendChild(opt);
                const dlOpt = document.createElement('option');
                dlOpt.value = `${s.name} (${s.code})`;
                datalist.appendChild(dlOpt);
            }
        }

        function filterDraftSets() {
            const query = document.getElementById('draftSetSearch').value.toLowerCase();
            if (!query) {
                populateDraftSetSelect(draftSetsData);
                return;
            }
            const filtered = draftSetsData.filter(s =>
                s.name.toLowerCase().includes(query) || s.code.toLowerCase().includes(query)
            );
            populateDraftSetSelect(filtered);
            if (filtered.length === 1) {
                document.getElementById('draftSetSelect').value = filtered[0].code;
            }
        }

        async function openBoosterPacks() {
            const setCode = document.getElementById('draftSetSelect').value;
            if (!setCode) {
                alert('Please select a set first.');
                return;
            }
            const boosterType = document.getElementById('draftBoosterType').value || undefined;
            const count = parseInt(document.getElementById('draftPackCount').value);
            const btn = document.getElementById('openPacksBtn');
            btn.disabled = true;
            btn.textContent = 'Opening...';

            try {
                let packs;
                if (count === 1) {
                    const pack = await api(`/boosters/${setCode}`, boosterType ? { type: boosterType } : {});
                    packs = [pack];
                } else {
                    const params = { count };
                    if (boosterType) params.type = boosterType;
                    packs = await api(`/boosters/${setCode}/batch`, params);
                }

                draftOpenedPacks = packs;
                draftCurrentPackIndex = 0;
                renderPackHistory();
                renderBoosterPack(0);
            } catch (err) {
                console.error('Failed to open packs:', err);
                const mainContent = document.getElementById('mainContent');
                mainContent.innerHTML = `<div style="padding:20px;color:#e94560;">Failed to open packs: ${escapeHtml(err.message)}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Open Packs';
            }
        }

        function renderPackHistory() {
            const historyDiv = document.getElementById('packHistory');
            const listDiv = document.getElementById('packHistoryList');
            if (draftOpenedPacks.length === 0) {
                historyDiv.style.display = 'none';
                return;
            }
            historyDiv.style.display = 'block';
            listDiv.innerHTML = '';
            for (let i = 0; i < draftOpenedPacks.length; i++) {
                const pack = draftOpenedPacks[i];
                const rares = pack.cards.filter(c => c.rarity === 'mythic' || c.rarity === 'rare');
                const rareName = rares.length > 0 ? rares[0].name : '';
                const div = document.createElement('div');
                div.className = 'pack-history-item' + (i === draftCurrentPackIndex ? ' active' : '');
                div.textContent = `Pack ${i + 1}${rareName ? ': ' + rareName : ''}`;
                div.onclick = () => {
                    draftCurrentPackIndex = i;
                    renderPackHistory();
                    renderBoosterPack(i);
                };
                listDiv.appendChild(div);
            }
        }

        function renderBoosterPack(index) {
            const pack = draftOpenedPacks[index];
            const mainContent = document.getElementById('mainContent');
            const rarityColors = { common: '#aaa', uncommon: '#4cc9f0', rare: '#f4a261', mythic: '#e94560' };

            let html = `<div class="booster-pack-header">
                <h2>${escapeHtml(pack.set_name)} <span style="color:#888;font-weight:400;">${pack.booster_type} booster</span></h2>
                <div class="pack-info">Pack ${index + 1} of ${draftOpenedPacks.length} &mdash; ${pack.cards.length} cards</div>
            </div>`;
            html += '<div class="booster-grid">';

            for (const card of pack.cards) {
                const foilClass = card.is_foil ? ' foil-card' : '';
                const rarityColor = rarityColors[card.rarity] || '#aaa';

                if (card.image_url) {
                    html += `<div class="booster-card${foilClass}" onclick="showCardDetail('${card.uuid}')">
                        <div class="card-slot" style="color:${rarityColor}">${card.slot}</div>
                        <img src="${card.image_url}" alt="${escapeHtml(card.name)}" loading="lazy">
                    </div>`;
                } else {
                    html += `<div class="booster-card-fallback${foilClass}">
                        <div class="card-name">${escapeHtml(card.name)}</div>
                        <div class="card-type">${escapeHtml(card.type_line || '')}</div>
                        <div class="card-rarity" style="color:${rarityColor}">${card.rarity}${card.is_foil ? ' FOIL' : ''}</div>
                        <div style="font-size:0.7rem;color:#666;margin-top:4px;">${card.slot}</div>
                    </div>`;
                }
            }

            html += '</div>';
            mainContent.innerHTML = html;
        }

        // Load initial data
        loadDecks();
        showHomeScreen();
    </script>
</body>
</html>
