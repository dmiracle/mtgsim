<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG Flashcards</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Dashboard View -->
    <div id="dashboard" class="view">
      <header>
        <h1>MTG Flashcards</h1>
      </header>

      <div class="stats-container">
        <div class="stat-card">
          <span class="stat-value" id="due-count">0</span>
          <span class="stat-label">Due Today</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="new-count">0</span>
          <span class="stat-label">New</span>
        </div>
        <div class="stat-card">
          <span class="stat-value" id="total-reviews">0</span>
          <span class="stat-label">Total Reviews</span>
        </div>
      </div>

      <div class="category-section">
        <h2>Select Category</h2>
        <div class="category-buttons">
          <button class="category-btn" data-category="abilityWords">
            <span class="category-name">Ability Words</span>
            <span class="category-count" id="count-abilityWords">0 cards</span>
          </button>
          <button class="category-btn" data-category="keywordAbilities">
            <span class="category-name">Keyword Abilities</span>
            <span class="category-count" id="count-keywordAbilities">0 cards</span>
          </button>
          <button class="category-btn" data-category="keywordActions">
            <span class="category-name">Keyword Actions</span>
            <span class="category-count" id="count-keywordActions">0 cards</span>
          </button>
        </div>
      </div>

      <div class="actions">
        <button id="reset-btn" class="secondary-btn">Reset All Progress</button>
      </div>
    </div>

    <!-- Review View -->
    <div id="review" class="view hidden">
      <header class="review-header">
        <button id="exit-btn" class="icon-btn">Exit</button>
        <span id="progress">0 / 0</span>
      </header>

      <div class="card-container">
        <div id="flashcard" class="flashcard">
          <div class="card-badge" id="card-category"></div>
          <div class="card-term" id="card-term"></div>
          <div class="card-definition hidden" id="card-definition"></div>
          <div class="card-hint" id="card-hint">tap or press space to reveal</div>
        </div>
      </div>

      <div id="rating-buttons" class="rating-buttons hidden">
        <button class="rating-btn again" data-rating="1">
          <span class="rating-label">Again</span>
          <span class="rating-interval" id="interval-again"></span>
        </button>
        <button class="rating-btn hard" data-rating="2">
          <span class="rating-label">Hard</span>
          <span class="rating-interval" id="interval-hard"></span>
        </button>
        <button class="rating-btn good" data-rating="3">
          <span class="rating-label">Good</span>
          <span class="rating-interval" id="interval-good"></span>
        </button>
        <button class="rating-btn easy" data-rating="4">
          <span class="rating-label">Easy</span>
          <span class="rating-interval" id="interval-easy"></span>
        </button>
      </div>
    </div>

    <!-- Complete View -->
    <div id="complete" class="view hidden">
      <div class="complete-content">
        <h2>Session Complete!</h2>
        <div class="session-stats">
          <div class="session-stat">
            <span class="session-stat-value" id="session-reviewed">0</span>
            <span class="session-stat-label">Cards Reviewed</span>
          </div>
          <div class="session-stat">
            <span class="session-stat-value" id="session-again">0</span>
            <span class="session-stat-label">Again</span>
          </div>
          <div class="session-stat">
            <span class="session-stat-value" id="session-hard">0</span>
            <span class="session-stat-label">Hard</span>
          </div>
          <div class="session-stat">
            <span class="session-stat-value" id="session-good">0</span>
            <span class="session-stat-label">Good</span>
          </div>
          <div class="session-stat">
            <span class="session-stat-value" id="session-easy">0</span>
            <span class="session-stat-label">Easy</span>
          </div>
        </div>
        <button id="back-btn" class="primary-btn">Back to Dashboard</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ts-fsrs@4/dist/index.umd.js"></script>
  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
