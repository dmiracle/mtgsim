[project]
name = "mtgsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Dylan Miracle", email = "dylan@strangeworks.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "fastmcp>=2.14.1",
    "openai>=2.12.0",
    "pydantic>=2.12.5",
    "sqlmodel>=0.0.27",
    "typer>=0.20.0",
    "uvicorn>=0.34.0",
    "requests>=2.31.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    "webapp"
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
]
ignore = [
    "B008",   # Do not perform function call in argument defaults (standard Typer pattern)
    "B904",   # Within except clause, raise with from (not needed for CLI exit codes)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[project.scripts]
mtgsim = "mtgsim:main"
mtgsim-api = "mtgsim.api.cli:main"

[build-system]
requires = ["uv_build>=0.8.19,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.149.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
